<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeaGuardian Operator</title>
<style>
  :root{--bg:#0b1620;--panel:#12222f;--line:#24394a;--text:#e6f0f6;--dim:#8aa3b5;--ok:#3ddc84;--warn:#ffb020;--bad:#ff4d5e;--accent:#4cc3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,Segoe UI,sans-serif}
  header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:22px;margin:0;letter-spacing:.04em}
  .tag{padding:3px 10px;border-radius:4px;font-weight:700;font-size:14px}
  .sim{background:var(--warn);color:#000}
  .hw{background:var(--ok);color:#000}
  #banner{display:none;margin:12px 20px 0;padding:14px 18px;border-radius:6px;background:var(--bad);color:#fff;font-size:22px;font-weight:700}
  #warnbar{display:none;margin:12px 20px 0;padding:10px 18px;border-radius:6px;background:var(--warn);color:#000;font-size:18px;font-weight:700}
  main{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;padding:16px 20px}
  @media (max-width:1000px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .panel h2{margin:0 0 10px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border:0}
  .row b{font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  button{background:#1d3446;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:15px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #estop{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:800;font-size:20px;padding:14px 22px}
  #start{background:#1c5a3a;border-color:var(--ok)}
  svg{width:100%;height:auto;background:#0e1c27;border-radius:6px}
  #log{max-height:360px;overflow:auto;font:13px/1.5 Consolas,monospace}
  #log div{padding:2px 0;border-bottom:1px solid #1a2c3a}
  .simbtns{display:none}
</style>
</head>
<body>
<header>
  <h1>SEAGUARDIAN</h1>
  <span id="mode" class="tag">...</span>
  <span>Mission: <b id="mission">-</b></span>
  <span>Link: <b id="link">-</b></span>
  <span>ESP32: <b id="espstate">-</b></span>
</header>
<div id="banner"></div>
<div id="warnbar"></div>
<main>
  <section class="panel">
    <h2>Inspection mission <span id="routetag" class="tag sim">SIMULATED ROUTE</span></h2>
    <svg id="map" viewBox="-5 -5 65 45"></svg>
    <div class="buttons">
      <button id="start">Start mission</button>
      <button data-a="abort">Abort</button>
      <button id="estop" data-a="estop">E-STOP</button>
      <button data-a="reset">Reset</button>
    </div>
    <div id="report" style="margin-top:10px;color:var(--dim)"></div>
  </section>
  <section class="panel">
    <h2>Sensors <span id="sensortag" class="tag sim">SIMULATED</span></h2>
    <div class="row"><span>Roll</span><b id="roll">-</b></div>
    <div class="row"><span>Pitch</span><b id="pitch">-</b></div>
    <div class="row"><span>Atmospheric pressure</span><b id="press">-</b></div>
    <div class="row"><span>Leak sensor</span><b id="leak">-</b></div>
    <div class="row"><span>Motor output L / R</span><b id="motors">-</b></div>
    <div class="row"><span>Telemetry received / lost</span><b id="rx">-</b></div>
    <h2 style="margin-top:16px">Link tests</h2>
    <div class="buttons">
      <button data-a="cut">Cut link (stop heartbeats)</button>
      <button data-a="restore">Restore link</button>
    </div>
    <div class="simbtns">
      <h2 style="margin-top:16px">Simulator fault injection</h2>
      <div class="buttons">
        <button data-a="sim_tilt">Toggle tilt 40&deg;</button>
        <button data-a="sim_leak">Toggle leak</button>
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>Event log</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, unit, d=1) => (v === undefined || v === null) ? "-" : `${Number(v).toFixed(d)} ${unit}`;
async function act(name){ try{ const r = await fetch(`/api/action/${name}`,{method:"POST"}); const j = await r.json(); if(j.result && j.result !== "ok" && !j.result.startsWith("Mission started")) alert(j.result); }catch(e){} refresh(); }
document.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => act(b.dataset.a));
$("start").onclick = () => act("start");

function drawMap(s){
  const pts = s.route.map(p => p.join(",")).join(" ");
  const [x,y] = s.position, end = s.route[s.route.length-1];
  $("map").innerHTML = `
    <rect x="-5" y="-5" width="9" height="45" fill="#2b3b48"/><text x="-4" y="38" font-size="3" fill="#8aa3b5">QUAY</text>
    <polyline points="${pts}" fill="none" stroke="#4cc3ff" stroke-width="0.6" stroke-dasharray="1.5 1"/>
    <circle cx="${end[0]}" cy="${end[1]}" r="2.2" fill="none" stroke="#ffb020" stroke-width="0.6"/>
    <text x="${end[0]-12}" y="${end[1]+6}" font-size="2.6" fill="#ffb020">inspection point</text>
    <circle cx="${x}" cy="${y}" r="1.6" fill="${s.link_ok ? '#3ddc84' : '#ff4d5e'}"/>`;
}

async function refresh(){
  let s; try{ s = await (await fetch("/api/state")).json(); }catch(e){ $("banner").style.display="block"; $("banner").textContent="Dashboard cannot reach the Pi software"; return; }
  const t = s.telemetry || {}, sim = s.simulated || s.mode === "SIMULATOR";
  $("mode").textContent = s.mode; $("mode").className = "tag " + (s.mode === "SIMULATOR" ? "sim" : "hw");
  $("sensortag").style.display = sim ? "" : "none";
  document.querySelector(".simbtns").style.display = s.mode === "SIMULATOR" ? "block" : "none";
  $("mission").textContent = s.mission;
  $("link").textContent = s.link_cut ? "CUT (test)" : (s.link_ok ? "OK" : "LOST");
  $("link").className = s.link_ok && !s.link_cut ? "ok" : "bad";
  $("espstate").textContent = t.state || "-"; $("espstate").className = t.state === "OK" ? "ok" : "bad";
  $("roll").textContent = fmt(t.roll, "deg"); $("pitch").textContent = fmt(t.pitch, "deg");
  $("press").textContent = fmt(t.p_hpa, "hPa");
  $("leak").textContent = t.leak === undefined ? "-" : (t.leak ? "WET" : "dry"); $("leak").className = t.leak ? "bad" : "ok";
  $("motors").textContent = t.l === undefined ? "-" : `${t.l.toFixed(2)} / ${t.r.toFixed(2)}`;
  $("rx").textContent = `${s.rx_count} / ${s.seq_gaps}`;
  const fault = (!s.link_ok && s.rx_count) ? "TELEMETRY LINK LOST" : (t.state && t.state !== "OK" ? `SAFETY STOP: ${t.state} - motors 0` : "");
  $("banner").style.display = fault ? "block" : "none"; $("banner").textContent = fault;
  $("warnbar").style.display = s.tilt_warning ? "block" : "none";
  $("warnbar").textContent = `TILT WARNING: roll ${t.roll} deg, pitch ${t.pitch} deg`;
  const r = s.inspection_report;
  $("report").textContent = r ? `Inspection report: roll ${r.roll} deg, pitch ${r.pitch} deg, pressure ${r.p_hpa} hPa, leak ${r.leak ? "YES" : "no"}${r.simulated ? " (SIMULATED)" : ""}` : "";
  drawMap(s);
  $("log").innerHTML = s.events.slice().reverse().map(e => {
    const time = new Date(e.wall*1000).toLocaleTimeString();
    const cls = e.level === "fault" ? "bad" : e.level === "warn" ? "warn" : "";
    return `<div class="${cls}">${time}  ${e.text.replace(/</g,"&lt;")}</div>`;
  }).join("");
}
setInterval(refresh, 250); refresh();
</script>
</body>
</html>
